name: Deploy Tutorial to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/tutorial/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HonKit
        run: npm install honkit@latest honkit-plugin-mermaid

      - name: Install plugins in book directory
        working-directory: docs/tutorial
        run: npm install honkit-plugin-mermaid

      - name: Build tutorial
        run: npx honkit build docs/tutorial _book

      - name: List build output
        run: ls -la _book/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
