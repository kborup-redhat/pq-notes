name: Deploy Tutorial to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/tutorial/**'
      - '.github/workflows/pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HonKit and plugins
        working-directory: docs/tutorial
        run: npm install honkit honkit-plugin-mermaid

      - name: Build tutorial
        working-directory: docs/tutorial
        run: npx honkit build . ./_book

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/tutorial/_book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
